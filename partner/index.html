<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner – Zukunftsarena 2026</title>
<meta name="description" content="Sponsoren und Partner der T-Systems Zukunftsarena 2026.">
<style>
  :root {
    --magenta: #E20074;
    --magenta-dark: #b3005c;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f0eef2;
    --text: #1a1a1e;
    --text-muted: #5c5c66;
    --border: #e2e0e6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,25,0.04), 0 4px 14px rgba(20,20,25,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014;
      --surface: #1a1a20;
      --surface-alt: #202028;
      --text: #f2f2f5;
      --text-muted: #a6a6b0;
      --border: #2c2c34;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-bottom: 16px;
  }

  main {
    padding: 16px 12px 4px;
    max-width: 640px;
    margin: 0 auto;
  }

  h2.tier-label {
    margin: 24px 4px 14px;
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
  }

  main > h2.tier-label:first-child {
    margin-top: 4px;
  }

  .slider {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background-color 0.5s ease;
  }

  .slider-viewport {
    overflow: hidden;
  }

  .slider-track {
    display: flex;
    transition: transform 0.5s ease;
  }

  .slide {
    flex: 0 0 100%;
    min-width: 0;
  }

  .slide a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 190px;
    padding: 28px 24px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .slide img,
  .slide svg {
    max-width: 100%;
    max-height: 130px;
    width: auto;
    height: auto;
    display: block;
  }

  .dots {
    display: flex;
    gap: 4px;
    padding: 0 16px 16px;
  }

  .dot {
    flex: 1 1 auto;
    height: 3px;
    border: 0;
    padding: 0;
    border-radius: 2px;
    background: var(--magenta);
    opacity: 0.4;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .dot.active {
    opacity: 1;
  }
</style>
</head>

  function renderSlider(tier) {
    var wrap = document.createElement('div');

    var h2 = document.createElement('h2');
    h2.className = 'tier-label';
    h2.textContent = tier.label;
    wrap.appendChild(h2);

    var slider = document.createElement('div');
    slider.className = 'slider';

    var viewport = document.createElement('div');
    viewport.className = 'slider-viewport';

    var track = document.createElement('div');
    track.className = 'slider-track';

    tier.slides.forEach(function (slide) {
      var slideEl = document.createElement('div');
      slideEl.className = 'slide';
      var a = document.createElement('a');
      a.href = slide.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', slide.name);
      a.innerHTML = slide.html;
      if (slide.bg) { a.style.backgroundColor = slide.bg; }
      slideEl.appendChild(a);
      track.appendChild(slideEl);
    });

    viewport.appendChild(track);
    slider.appendChild(viewport);

    var dots = document.createElement('div');
    dots.className = 'dots';
    var dotEls = [];
    tier.slides.forEach(function (slide, i) {
      var dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.type = 'button';
      dot.setAttribute('aria-label', slide.name);
      dotEls.push(dot);
      dots.appendChild(dot);
    });
    slider.appendChild(dots);

    wrap.appendChild(slider);

    var index = 0;
    var count = tier.slides.length;

    function goTo(i) {
      index = (i + count) % count;
      track.style.transform = 'translateX(-' + (index * 100) + '%)';
      slider.style.backgroundColor = tier.slides[index].bg || '';
      dotEls.forEach(function (d, di) {
        d.classList.toggle('active', di === index);
      });
    }
    goTo(0);

    var timer = null;
    function startAutoplay() {
      if (count < 2) return;
      timer = setInterval(function () { goTo(index + 1); }, 4000);
    }
    function resetAutoplay() {
      if (timer) clearInterval(timer);
      startAutoplay();
    }

    dotEls.forEach(function (dot, i) {
      dot.addEventListener('click', function () {
        goTo(i);
        resetAutoplay();
      });
    });

    startAutoplay();

    return wrap;
  }

  var app = document.getElementById('app');
  tiers.forEach(function (tier) {
    app.appendChild(renderSlider(tier));
  });
</script>

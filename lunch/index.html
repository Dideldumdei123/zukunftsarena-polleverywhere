<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch &amp; Apéro – Zukunftsarena 2026</title>
<meta name="description" content="Lunch- und Apéro-Menü der T-Systems Zukunftsarena 2026.">
<style>
  :root {
    --magenta: #E20074;
    --magenta-dark: #b3005c;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-alt: #f0eef2;
    --text: #1a1a1e;
    --text-muted: #5c5c66;
    --border: #e2e0e6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,25,0.04), 0 4px 14px rgba(20,20,25,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014;
      --surface: #1a1a20;
      --surface-alt: #202028;
      --text: #f2f2f5;
      --text-muted: #a6a6b0;
      --border: #2c2c34;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-bottom: 16px;
  }

  nav.rounds {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  nav.rounds button {
    flex: 1 1 auto;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
  }

  nav.rounds button.active {
    background: var(--magenta);
    border-color: var(--magenta);
    color: #fff;
  }

  main {
    padding: 12px 12px 0;
    max-width: 640px;
    margin: 0 auto;
  }

  .round-panel { display: none; }
  .round-panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 8px;
    padding: 11px 13px;
  }

  .card p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.45;
  }

  .sponsors {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .sponsors p.label {
    margin: 0 2px 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .sponsor-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .sponsor-chip {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 12px 16px;
    min-width: 100px;
  }

  .sponsor-chip img,
  .sponsor-chip svg {
    height: 22px;
    width: auto;
    max-width: 100%;
    display: block;
  }
</style>
</head>
<body>

<nav class="rounds">
  <button class="active" data-panel="lunch">Lunch</button>
  <button data-panel="apero">Apéro</button>
</nav>

</main>

<script>
  const lunch = [
    "Couscous-Salat mit getrockneten Früchten, Granatapfel und frischer Minze (vegan) (enthält gluten)",
    "Geräucherte Forelle (dk) mit Rande, Meerrettich und Dill (gluten frei) (enthält laktose)",
    "Rosa gegartes Rind (ch) mit Pilzen, Raddicchio und Belper Knolle (gluten frei) (enthält laktose)",
    "Karotten-Ingwersuppe mit kandiertem Ingwer (vegan/gluten frei)",
    "Gebratene Maispouladenbrust (fr) mit Lila Rüebli und Rosmarin-Jus (gluten/laktose frei)",
    "Gebratens schottisches Lachsfilet auf Mangold (gluten/laktose frei)",
    "Gebratenen Reis mit asiatischem Gemüse und frischem Koriander (vegan/gluten frei)",
    "Röstkartoffeln (vegan/gluten frei)",
    "Vanille-Blaubeer-Trifle mit Cassis (vegan/glutenfrei/nussfrei)",
    "Schokoladen-Tart mit weisser Schokoladen-Brombeer-Cremeux (enthält gluten/laktose/nüsse)"
  ];

  const apero = [
    "Vegane Sushi-Rolle mit Avocado, Gurke und Sesam-Sojasauce (gluten frei)",
    "Randen-Hummus mit schwarzem Sesam und Mini-Pita-Brot (laktose frei) (enthält gluten)",
    "Rinds-Tatar (ch) mit Kresse, Lachskaviar und geröstetem Brioche (enthält gluten/laktose)",
    "Rauchlachs-Trifle mit Rahmgurken, Dill-Öl und Ahorn-Granola (gluten frei) (enthält laktose)",
    "Hausgemachte Käsespätzle mit Röstzwiebeln und Bergkäse (enthält gluten/laktose)",
    "Meeresfrüchte Pfanne mit Oliven, Tomaten und Kürbis-Kartoffelpüree (gluten frei) (enthält laktose)",
    "Hausgemachte saisonale Bratwurst mit geschmortem Federkohl und Kartoffeln (gluten/laktose frei)",
    "Pulled-Duck-Sandwich mit Rotkohl-Coleslaw, Preiselbeer-Mayonaisse und Kresse (enthält gluten/laktose)",
    "Apfel-Cheesecake-Tart mit Vanille-Creme und Karamell (enthält gluten/laktose/nüsse)",
    "Tonka-Panna Cotta mit Kirsch-Kompott (vegan/glutenfrei/nussfrei)",
    "Toblerone-Mousse-Schnitte mit gerösteten Haselnüssen (enthält gluten/laktose/nüsse)"
  ];

  function renderItem(text) {
    return '<div class="card"><p>' + text + '</p></div>';
  }

  document.getElementById('lunch-list').innerHTML = lunch.map(renderItem).join('');
  document.getElementById('apero-list').innerHTML = apero.map(renderItem).join('');

  document.querySelectorAll('nav.rounds button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('nav.rounds button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.round-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>

</body>
</html>
